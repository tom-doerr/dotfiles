#!/usr/sbin/nft -f
# NAS host firewall — table inet nas_lockdown.  SOURCE OF TRUTH = this file (dotfiles systemd/nas/).
# [tom 2026-09-20] Model = access by TRANSPORT, copied from spark-1's tailscale_only:
#   lo + tailscale0 always; the NAS's own containers (docker0, br-*) always; the LAN enp89s0 ONLY from
#   the sparks (set lan_peers); everything else on 192.168.8.0/24 refused for NEW connections.
#   Default-deny is `ct state new` only, so tightening never severs a live connection.
# [tom 2026-09-20] WHY: since the Jul 3 reinstall this file was Debian's empty stock one and Docker
#   published ten services on 0.0.0.0 to a shared WPA2 LAN full of IoT devices — Phoenix (LLM
#   prompts) and MLflow (read+write) with no auth at all, Postgres one password away.
# [tom 2026-09-20] FORWARD CHAIN IS NOT OPTIONAL: Docker-published ports are DNAT'd in prerouting and
#   FORWARDed, so they never touch `input`. LAN -> container dies here or nowhere.
# [tom 2026-09-20] NO `flush ruleset` — that would destroy Docker's own ip/ip6 nat+filter tables and
#   break every container until dockerd restarts. `destroy table` makes THIS table idempotent.
# Apply: sudo nft -c -f FILE && sudo nft -f FILE.  Never `nft insert`/`add rule` — amend here.
# Gotcha (spark-1): `limit rate … log … drop` in ONE rule lets over-rate packets through — log and drop
#   are separate rules below.
destroy table inet nas_lockdown
table inet nas_lockdown {
    set lan_peers {
        type ipv4_addr; flags interval;
        # [tom 2026-09-20] the three sparks' LAN addresses (wire + wifi) — an emergency path if
        # tailscaled on the NAS is swapped out (it has been, under memory storms). NOT the robot
        # (mobile system, must not reach the NAS), NOT desktop-20-3.
        elements = { 192.168.8.140, 192.168.8.137,   # spark-1 wire, wifi
                     192.168.8.164,                  # spark-2 wifi
                     192.168.8.225, 192.168.8.100 }  # spark-3 wifi, wire
    }
    set blocked_tcp {
        type ipv4_addr . inet_service; size 8192; flags dynamic,timeout; timeout 7d;
    }
    chain input {
        type filter hook input priority -100; policy accept;
        ct state established,related accept   # [tom 2026-09-20] never sever a live connection
        iifname "lo" accept
        iifname "tailscale0" accept
        iifname "docker0" accept               # [tom 2026-09-20] own containers -> host services
        iifname "br-*" accept                  #   (prometheus container scrapes node_exporter :9100)
        udp dport 41641 accept                 # tailscale direct connections
        udp sport 67 udp dport 68 accept       # DHCP replies on enp89s0
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept           # NDP — dropping this breaks IPv6 entirely
        iifname "enp89s0" ip saddr @lan_peers accept
        ct state new meta nfproto ipv4 meta l4proto tcp iifname != "lo" iifname != "tailscale0" \
            update @blocked_tcp { ip saddr . tcp dport } \
            limit rate 10/minute log prefix "nas-drop-tcp: "   # [tom 2026-09-20] who is knocking
        ct state new iifname != "lo" iifname != "tailscale0" counter drop
    }
    chain forward {
        type filter hook forward priority -100; policy accept;
        ct state established,related accept
        iifname "tailscale0" accept            # sparks -> published container ports
        iifname "docker0" accept               # containers -> anywhere
        iifname "br-*" accept
        iifname "enp89s0" ip saddr @lan_peers accept
        ct state new iifname "enp89s0" counter drop   # [tom 2026-09-20] LAN -> DNAT'd container port
    }
}
